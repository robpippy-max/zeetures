name: nightly

# A nightly build of Zeetures, this fork (owner, 2026-11-15): each night, if anything
# has been committed since the last nightly, build it and replace the
# "nightly" pre-release with the new build (Linux, Windows, macOS on Apple
# Silicon and Intel, and 32-bit Linux and Windows). Run by hand (Actions > nightly >
# Run workflow) to build now, changed or not; run on another branch, it
# builds everything but publishes nothing.
#
# Players' downloads (owner, 2026-11-20: no command line): Zeetures-Setup.exe
# (Windows installer, 64- and 32-bit), Zeetures-macOS.dmg (one app for
# Apple Silicon and Intel), Zeetures-x86_64.AppImage and Zeetures-i686.AppImage
# (Linux), beside the plain archives. Scripts: packaging/.

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC, the small hours in Montana
  workflow_dispatch:

permissions:
  contents: write

env:
  MAKEFLAGS: -j3

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      previous: ${{ steps.decide.outputs.previous }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - id: decide
      run: |
        prev=$(git rev-parse -q --verify "refs/tags/nightly^{commit}" || true)
        echo "previous=$prev" >> "$GITHUB_OUTPUT"
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$prev" != "$GITHUB_SHA" ]; then
          echo "build=true" >> "$GITHUB_OUTPUT"
        else
          echo "build=false" >> "$GITHUB_OUTPUT"
          echo "Nothing new since the last nightly ($prev)."
        fi

  linux:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install build tools
      run: |
        sudo apt-get update
        # SDL3 is built from externals (OPENC2E_BUNDLED_SDL), so the build
        # runs on systems without an SDL3 package; these are its headers
        sudo apt-get install -y build-essential cmake python3 zlib1g-dev libpng-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxfixes-dev \
          libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdecor-0-dev wayland-protocols \
          libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev
    - name: Build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_POLICY_DEFAULT_CMP0069=NEW -DOPENC2E_ASAN=OFF -DOPENC2E_DEV_HOOKS=OFF -DOPENC2E_BUNDLED_SDL=ON
        cmake --build build
    - name: Package
      run: |
        out=zeetures-nightly-linux-x86_64
        cmake --install build --prefix "$out"
        # (without the debug information: the engine was 138 MB with it)
        strip "$out"/openc2e
        cp .github/nightly/README.txt "$out/README-NIGHTLY.txt"
        tar czf "$out.tar.gz" "$out"
        # (used only if linux-appimage's, which runs on older systems, fails)
        packaging/linux/make-appimage.sh "$out" x86_64 Zeetures-x86_64.AppImage
        # (--version exits 1 in openc2e; its output shows the program runs)
        ./Zeetures-x86_64.AppImage --appimage-extract-and-run --version | grep -q "^openc2e"
    - uses: actions/upload-artifact@v4
      with:
        name: linux
        path: zeetures-nightly-linux-x86_64.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: linux-appimage-fallback
        path: Zeetures-x86_64.AppImage

  # The Linux AppImage, built on Ubuntu 22.04 so that it runs on systems as
  # old as that (glibc 2.35: Ubuntu 22.04, Debian 12, Zorin 17, Mint 21)
  linux-appimage:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-12 g++-12 cmake python3 zlib1g-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxfixes-dev \
          libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdecor-0-dev wayland-protocols \
          libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev
    - name: Build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_POLICY_DEFAULT_CMP0069=NEW -DOPENC2E_ASAN=OFF -DOPENC2E_DEV_HOOKS=OFF -DOPENC2E_BUNDLED_SDL=ON \
          -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
        cmake --build build
    - name: Package
      run: |
        cmake --install build --prefix installed
        strip installed/openc2e
        packaging/linux/make-appimage.sh installed x86_64 Zeetures-x86_64.AppImage
        # (--version exits 1 in openc2e; its output shows the program runs)
        ./Zeetures-x86_64.AppImage --appimage-extract-and-run --version | grep -q "^openc2e"
    - uses: actions/upload-artifact@v4
      with:
        name: linux-appimage
        path: Zeetures-x86_64.AppImage

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    # (the fork has not been built on Windows before: a failed build here
    # leaves the Linux download as the night's release)
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        cmake -S . -B build -DOPENC2E_ASAN=OFF -DOPENC2E_DEV_HOOKS=OFF
        cmake --build build --config RelWithDebInfo
    - name: Package
      shell: bash
      run: |
        out=zeetures-nightly-windows-x64
        cmake --install build --config RelWithDebInfo --prefix "$out"
        cp .github/nightly/README.txt "$out/README-NIGHTLY.txt"
        7z a "$out.zip" "$out"
    - uses: actions/upload-artifact@v4
      with:
        name: windows
        path: zeetures-nightly-windows-x64.zip

  # macOS: one universal program (Apple Silicon and Intel, macOS 10.15 and
  # later) as Zeetures.app in a disk image. GitHub's macOS runners were
  # sometimes not available at all (2026-11-16 to 11-20: "The job was not
  # acquired by Runner"), so if this job does not finish, macos-fallback
  # builds the same on an Intel runner, a separate pool; and if both fail,
  # the release keeps the previous night's disk image (release, below).
  macos:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 90
    outputs:
      built: ${{ steps.done.outputs.built }}
    steps:
    - uses: actions/checkout@v4
    - name: Build and package
      run: packaging/macos/build.sh Zeetures-macOS.dmg
    - uses: actions/upload-artifact@v4
      with:
        name: macos
        path: Zeetures-macOS.dmg
    - id: done
      run: echo "built=true" >> "$GITHUB_OUTPUT"

  macos-fallback:
    needs: [check, macos]
    # (the job's own result reads "success" under continue-on-error, so its
    # output says whether it really built)
    if: always() && needs.check.outputs.build == 'true' && needs.macos.outputs.built != 'true'
    runs-on: macos-15-intel
    continue-on-error: true
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - name: Build and package
      run: packaging/macos/build.sh Zeetures-macOS.dmg
    - uses: actions/upload-artifact@v4
      with:
        name: macos
        path: Zeetures-macOS.dmg

  # 32-bit builds (owner, 2026-11-15: it should run on 32-bit machines
  # too); allowed to fail like the other new ones
  windows-32:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        cmake -S . -B build -A Win32 -DOPENC2E_ASAN=OFF -DOPENC2E_DEV_HOOKS=OFF
        cmake --build build --config RelWithDebInfo
    - name: Package
      shell: bash
      run: |
        out=zeetures-nightly-windows-x86
        cmake --install build --config RelWithDebInfo --prefix "$out"
        cp .github/nightly/README.txt "$out/README-NIGHTLY.txt"
        7z a "$out.zip" "$out"
    - uses: actions/upload-artifact@v4
      with:
        name: windows-32
        path: zeetures-nightly-windows-x86.zip

  # The Windows installer: both builds in one Zeetures-Setup.exe (Inno Setup)
  windows-installer:
    needs: [check, windows, windows-32]
    if: always() && needs.check.outputs.build == 'true'
    runs-on: windows-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: dist
    - name: Installer
      shell: pwsh
      run: |
        $version = (Select-String -Path src/openc2e/openc2eimgui/C2ToolBar.cpp -Pattern '^#define OPENC2E_FORK_VERSION "(.*)"').Matches[0].Groups[1].Value
        7z x dist/windows/zeetures-nightly-windows-x64.zip -oexpanded
        if ($LASTEXITCODE -ne 0) { exit 1 }
        $isccArgs = @("/DX64Dir=$PWD\expanded\zeetures-nightly-windows-x64", "/DAppVersion=$version", "/DOutDir=$PWD\out")
        if (Test-Path dist/windows-32/zeetures-nightly-windows-x86.zip) {
          7z x dist/windows-32/zeetures-nightly-windows-x86.zip -oexpanded
          $isccArgs += "/DX86Dir=$PWD\expanded\zeetures-nightly-windows-x86"
        }
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
        & $iscc @isccArgs packaging\windows\zeetures.iss
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: out/Zeetures-Setup.exe

  linux-32:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Install build tools
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y cmake python3 gcc-multilib g++-multilib zlib1g-dev:i386 libpng-dev:i386 libx11-dev:i386 libxext-dev:i386 libxcursor-dev:i386 libxrandr-dev:i386 libxi-dev:i386 libxss-dev:i386 libxtst-dev:i386 libxfixes-dev:i386 libxkbcommon-dev:i386 libgl1-mesa-dev:i386 libegl1-mesa-dev:i386 libasound2-dev:i386 libpulse-dev:i386
        echo "PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
    - name: Build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_LIBRARY_ARCHITECTURE=i386-linux-gnu -DOPENC2E_BUNDLED_SDL=ON -DOPENC2E_ASAN=OFF -DOPENC2E_DEV_HOOKS=OFF -DSDL_WAYLAND=OFF
        cmake --build build
    - name: Package
      run: |
        out=zeetures-nightly-linux-i386
        cmake --install build --prefix "$out"
        strip "$out"/openc2e
        cp .github/nightly/README.txt "$out/README-NIGHTLY.txt"
        tar czf "$out.tar.gz" "$out"
        packaging/linux/make-appimage.sh "$out" i686 Zeetures-i686.AppImage
    - uses: actions/upload-artifact@v4
      with:
        name: linux-32
        path: |
          zeetures-nightly-linux-i386.tar.gz
          Zeetures-i686.AppImage

  release:
    needs: [check, linux, linux-appimage, windows, windows-32, windows-installer, macos, macos-fallback, linux-32]
    # (only the creature-mind branch publishes; other branches just build)
    if: always() && needs.check.outputs.build == 'true' && needs.linux.result == 'success' && github.ref_name == 'creature-mind'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        path: dist
    - name: Collect the files
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir files
        find dist -path dist/linux-appimage-fallback -prune -o -type f \( -name '*.tar.gz' -o -name '*.zip' \
          -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -exec cp {} files/ \;
        # (the AppImage built on Ubuntu 24.04 only if the 22.04 one failed)
        if [ ! -f files/Zeetures-x86_64.AppImage ]; then
          cp dist/linux-appimage-fallback/Zeetures-x86_64.AppImage files/ || true
        fi
        # A download whose build failed tonight (for example no macOS runner
        # was available) is kept from the previous nightly, so no system
        # drops out of the release
        gh release view nightly --json name -q .name > previous-title.txt 2>/dev/null || true
        gh release download nightly -D previous 2>/dev/null || true
        : > carried.txt
        for f in Zeetures-Setup.exe Zeetures-macOS.dmg Zeetures-x86_64.AppImage Zeetures-i686.AppImage \
          zeetures-nightly-linux-x86_64.tar.gz zeetures-nightly-linux-i386.tar.gz \
          zeetures-nightly-windows-x64.zip zeetures-nightly-windows-x86.zip; do
          if [ ! -f "files/$f" ] && [ -f "previous/$f" ]; then
            cp "previous/$f" files/
            echo "$f" >> carried.txt
          fi
        done
        # For the game's own updater (Updater.cpp): the version, and each
        # download built tonight with its size and SHA-256 (one kept from an
        # earlier night is an older version, so it is not offered)
        version=$(sed -n 's/^#define OPENC2E_FORK_VERSION "\(.*\)"$/\1/p' src/openc2e/openc2eimgui/C2ToolBar.cpp)
        {
          echo "version $version"
          echo "commit $GITHUB_SHA"
          for f in Zeetures-Setup.exe Zeetures-macOS.dmg Zeetures-x86_64.AppImage Zeetures-i686.AppImage; do
            if [ -f "files/$f" ] && ! grep -qx "$f" carried.txt; then
              echo "file $f $(stat -c %s "files/$f") $(sha256sum "files/$f" | cut -d' ' -f1)"
            fi
          done
        } > files/zeetures-update.txt
        cat files/zeetures-update.txt
        ls -l files
    - name: Release notes
      run: |
        prev="${{ needs.check.outputs.previous }}"
        {
          echo "Nightly build of Zeetures, a labor of love by an old fan: a fan fork of [openc2e](https://github.com/openc2e/openc2e) (forked from its commit dfcd46f2, 7 October 2026), from the creature-mind branch at ${GITHUB_SHA:0:8}, $(date -u +%Y-%m-%d)."
          echo
          echo "You need your own copy of Creatures 2 (Steam's \"Creatures: The Albian Years\", or GOG). Zeetures finds it in the usual Steam and GOG folders, or asks for its folder the first time."
          echo
          echo "**Which file:** Windows: \`Zeetures-Setup.exe\`. Mac (Apple Silicon or Intel): \`Zeetures-macOS.dmg\`. Linux: \`Zeetures-x86_64.AppImage\` (\`Zeetures-i686.AppImage\` on 32-bit). The one-time steps for each are under [Download and play](https://github.com/${GITHUB_REPOSITORY}#download-and-play). The .zip and .tar.gz files are the same programs unpacked, for those who prefer them."
          echo
          if [ -s carried.txt ]; then
            echo "**Kept from the previous nightly** ($(cat previous-title.txt 2>/dev/null)), because tonight's build of it did not finish (often no GitHub runner was free): $(sed 's/.*/`&`/' carried.txt | paste -sd, - | sed 's/,/, /g'). It does not have tonight's changes."
            echo
          fi
          echo "Every change since the fork, in technical detail: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/CHANGELOG.md)."
          echo
          if [ -n "$prev" ] && [ "$prev" != "$GITHUB_SHA" ]; then
            echo "Changes since the last nightly:"
            echo
            git log --format='- %s' "$prev..$GITHUB_SHA"
          else
            echo "Latest changes:"
            echo
            git log --format='- %s' -n 30 "$GITHUB_SHA"
          fi
        } > notes.md
    - name: Replace the nightly release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # The release's tag must be the branch's newest commit: GitHub
        # refuses this token a tag on an older one whose workflow files
        # differ (2026-11-15: a push during the build left no release at
        # all, the old one already deleted). If the branch moved on during
        # the build, the release is left as it was for the next run.
        git fetch -q origin "${GITHUB_REF_NAME}"
        if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
          echo "The branch moved on during the build; the nightly release is left as it was."
          exit 0
        fi
        gh release delete nightly --cleanup-tag --yes || true
        git push origin ":refs/tags/nightly" || true
        gh release create nightly files/* --prerelease --target "$GITHUB_SHA" \
          --title "Zeetures nightly $(date -u +%Y-%m-%d) (${GITHUB_SHA:0:8})" --notes-file notes.md
        # Players must be able to download it. GitHub can handle the old
        # tag's deletion after the new release is made and turn that into
        # a draft, which only the owner can see (2026-11-22: the job said
        # success, and every download was "not found"). Published again if
        # so; the job fails if a download still does not answer.
        url="https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/zeetures-nightly-linux-x86_64.tar.gz"
        for i in 1 2 3 4 5 6; do
          sleep 30
          if [ "$(gh release view nightly --json isDraft -q .isDraft)" = true ]; then
            echo "The release is a draft: publishing it again."
            gh release edit nightly --draft=false --prerelease
            continue
          fi
          code=$(curl -sL -o /dev/null -w '%{http_code}' "$url" || true)
          echo "Public download: $code"
          if [ "$code" = 200 ] && [ "$i" -ge 3 ]; then exit 0; fi
        done
        echo "The release is not public."
        exit 1
